services:
  # Un solo Web Service: compila el frontend y la API lo sirve junto con /api
  - type: web
    name: refaccionaria
    runtime: node
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build && npm --prefix backend install
    startCommand: npm --prefix backend start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
